<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>关注计数器 – 防撞限、查回关</title>
<style>
  :root { color-scheme: light dark; --fg: #0f1419; --sub: #536471; --bg: #f4f6f8; --card: #fff; --link: #1366a6; }
  @media (prefers-color-scheme: dark) { :root { --fg: #e7e9ea; --sub: #8b98a5; --bg: #0b0d10; --card: #16181c; --link: #1d9bf0; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.7 -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif; }
  main { max-width: 720px; margin: 32px auto; padding: 28px 32px; background: var(--card); border-radius: 16px; }
  h1 { font-size: 26px; line-height: 1.3; margin: 0 0 8px; }
  p { color: var(--sub); }
  img { max-width: 100%; border-radius: 12px; margin: 12px 0; }
  a { color: var(--link); font-weight: 600; }
  ul { padding-left: 1.3em; }
</style>
</head>
<body>
<main>
  <h1>关注计数器 – 防撞限、查回关</h1>
  <p>给在 X（原 Twitter）上靠关注起号的新手用的 Chrome 插件：数每轮关注了几个，快到上限提醒歇一下，撞限后计时；还能找出没回关你的人。只记录、不替你操作，数据只存在你自己的电脑里。</p>
  <img src="images/overview.png" alt="弹窗、未回关名单和数据说明页">
  <ul>
    <li><a href="https://github.com/mikuairai/follow-counter">源码和安装方法（GitHub）</a></li>
    <li><a href="privacy/">隐私政策 / Privacy Policy</a></li>
  </ul>
  <p>本项目与 X Corp. 没有关联。</p>
</main>
</body>
</html>
