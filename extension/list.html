<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>未回关名单 · 关注计数器</title>
<link rel="icon" href="icons/icon32.png">
<style>
  :root { --blue: #1d9bf0; --amber: #ffad1f; --red: #f4212e; --green: #00ba7c;
    --page: #f4f6f8; --card: #fff; --fg: #0f1419; --sub: #536471; --line: #eff3f4; --tile: #f7f9f9; --empty: #e1e8ed;
    --link: #1366a6; --warn-t: #8a5300; --stop-t: #b0141f; color-scheme: light; }
  :root[data-theme="dark"] { --page: #0b0d10; --card: #16181c; --fg: #e7e9ea; --sub: #8b98a5; --line: #2f3336; --tile: #202327; --empty: #2f3336;
    --link: var(--blue); --warn-t: var(--amber); --stop-t: #ff6b75; color-scheme: dark; }
  * { box-sizing: border-box; }
  ::selection { background: rgba(29, 155, 240, .3); }
  body { margin: 0; background: var(--page); color: var(--fg);
    font: 14px/1.55 -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 28px 20px 60px; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  header img { width: 32px; height: 32px; }
  header h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
  header p { margin: 2px 0 0; color: var(--sub); font-size: 13px; }
  .card { background: var(--card); border-radius: 16px; padding: 18px 20px; margin-bottom: 12px;
    box-shadow: 0 1px 2px rgba(15, 20, 25, .06), 0 2px 8px rgba(15, 20, 25, .04); }
  h2 { margin: 0 0 8px; font-size: 15px; font-weight: 800; }

  .cover { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center; }
  .cover .big { font-size: 30px; font-weight: 800; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
  .cover .big small { font-size: 14px; font-weight: 600; color: var(--sub); margin-left: 4px; letter-spacing: 0; }
  .bar { height: 8px; border-radius: 4px; background: var(--empty); overflow: hidden; margin: 8px 0 6px; }
  .bar i { display: block; height: 100%; background: var(--blue); border-radius: 4px; transition: width 400ms cubic-bezier(0.16, 1, 0.3, 1); }
  .hint { color: var(--sub); font-size: 13px; }
  .btn { font: inherit; font-size: 13px; font-weight: 700; padding: 8px 16px; border-radius: 999px; border: 0; cursor: pointer;
    background: var(--tile); color: var(--fg); white-space: nowrap; }
  .btn:hover { background: var(--empty); }
  .btn.primary { background: #1366a6; color: #fff; }
  .btn.primary:hover { background: #0f5a93; }
  .btn[disabled] { opacity: .5; cursor: default; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

  .guard { padding: 12px 16px; border-radius: 12px; font-size: 13px; line-height: 1.6; background: var(--card); margin-bottom: 12px; }
  .guard.warn { background: rgba(255, 173, 31, .16); color: var(--warn-t); }
  .guard.high { background: rgba(244, 33, 46, .12); color: var(--stop-t); }
  .guard a { color: inherit; font-weight: 700; text-underline-offset: 2px; }

  .tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; }
  .chip { font: inherit; font-size: 13px; font-weight: 700; padding: 6px 12px; border-radius: 999px; border: 0; cursor: pointer;
    background: var(--tile); color: var(--sub); }
  .chip:hover { color: var(--fg); }
  .chip[aria-pressed="true"] { background: var(--fg); color: var(--card); }
  .chip span { font-weight: 600; opacity: .75; margin-left: 4px; font-variant-numeric: tabular-nums; }
  input[type=search] { font: inherit; font-size: 13px; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--empty);
    background: var(--card); color: var(--fg); width: 180px; }

  .rows { list-style: none; margin: 0; padding: 0; }
  .rows li { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 11px 0; border-top: 1px solid var(--line); }
  .rows li:first-child { border-top: 0; }
  .rows a { color: var(--link); font-weight: 700; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
  .rows a:hover { text-decoration: underline; text-underline-offset: 2px; }
  .rows a svg { opacity: .7; }
  .help { display: flex; gap: 10px; align-items: flex-start; background: var(--tile); border-radius: 12px; padding: 10px 14px;
    font-size: 13px; line-height: 1.6; color: var(--sub); margin-bottom: 6px; }
  .help b { color: var(--fg); }
  .help .k { flex: none; font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; margin-top: 1px;
    background: rgba(0, 186, 124, .14); color: #00653f; }
  [data-theme="dark"] .help .k { color: var(--green); }
  .rows .meta { color: var(--sub); font-size: 12px; margin-top: 1px; }
  .tag { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; white-space: nowrap; background: var(--tile); color: var(--sub); }
  .tag.no { background: rgba(244, 33, 46, .1); color: var(--stop-t); }
  .tag.keep { background: rgba(0, 186, 124, .14); color: #00653f; }
  [data-theme="dark"] .tag.keep { color: var(--green); }
  .acts { display: flex; align-items: center; gap: 8px; }
  .btn.small { padding: 4px 12px; font-size: 12px; }
  .tag.fresh { background: rgba(255, 173, 31, .16); color: var(--warn-t); }
  .empty { padding: 28px 8px; text-align: center; color: var(--sub); }
  .more { display: block; margin: 12px auto 0; }
  .more[hidden] { display: none; }
  .foot { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); opacity: 0;
    background: var(--fg); color: var(--card); padding: 8px 16px; border-radius: 999px; font-size: 13px; font-weight: 700;
    transition: opacity 200ms, transform 300ms cubic-bezier(0.16, 1, 0.3, 1); pointer-events: none; }
  .toast.show { opacity: 1; transform: translateX(-50%); }
  @media (prefers-reduced-motion: reduce) { .toast, .bar i { transition: opacity 200ms; } }
  @media (max-width: 560px) { .cover { grid-template-columns: 1fr; } input[type=search] { width: 100%; } }
</style>
</head>
<body>
<main>
  <header>
    <img src="icons/icon32.png" alt="">
    <div>
      <h1>未回关名单</h1>
      <p>你关注了、但还没关注你的人。点人名打开对方主页，关注、取关都在 X 上由你自己点。</p>
    </div>
  </header>

  <section class="card cover">
    <div>
      <div class="big" id="seen">0<small>人已读取</small></div>
      <div class="bar"><i id="coverBar" style="width:0"></i></div>
      <div class="hint" id="coverText"></div>
    </div>
    <button class="btn primary" id="openFollowing" type="button">打开我的关注列表</button>
  </section>

  <div class="guard" id="guard"></div>

  <section class="card">
    <div class="tools">
      <div class="chips" id="chips" role="group" aria-label="筛选"></div>
      <input type="search" id="q" placeholder="搜索用户名" aria-label="搜索用户名">
    </div>
    <div class="help" id="help"></div>
    <ul class="rows" id="rows"></ul>
    <button class="btn more" id="more" type="button" hidden>显示更多</button>
    <div class="foot">
      <button class="btn" id="copy" type="button">复制当前列表的用户名</button>
      <button class="btn" id="reset" type="button">清空名单，重新读取</button>
    </div>
  </section>
</main>
<div class="toast" id="toast" role="status"></div>
<script src="limits.js"></script>
<script src="stats.js"></script>
<script src="list.js"></script>
</body>
</html>
